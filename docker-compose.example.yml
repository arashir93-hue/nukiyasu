# Ejemplo de despliegue de Nukiyasu.
#
# 1. Copia este archivo como docker-compose.yml
# 2. Cambia ACCESS_SECRET y REFRESH_SECRET
# 3. Cambia /ruta/a/nukiyasu-library por la ruta de tu biblioteca
# 4. Ajusta el puerto 8080 si lo necesitas
# 5. Ejecuta: docker compose up -d --build

services:
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - cache
    environment:
      # Genera dos secretos diferentes con:
      # openssl rand -hex 32
      ACCESS_SECRET: "CAMBIA_ESTE_SECRETO"
      REFRESH_SECRET: "CAMBIA_ESTE_SECRETO"

      # No cambiar: son los nombres internos de los servicios Docker.
      REDIS_HOST: cache
      MONGOURL: mongodb://mongodb:27017/yomiyasu

    volumes:
      # Ruta ABSOLUTA de la biblioteca.
      # Debe contener las carpetas mangas/ y novelas/.
      - /ruta/a/nukiyasu-library:/usr/src/exterior

      # Diccionarios opcionales.
      # Si no los utilizas, puedes dejar ./dicts como carpeta vacía.
      - ./dicts:/usr/src/dicts

    networks:
      - nukiyasu

  cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data
    networks:
      - nukiyasu

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    networks:
      - nukiyasu

  ebook:
    image: alexay7/ttu-yomiyasu
    restart: unless-stopped
    networks:
      - nukiyasu

  client:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - ebook
    ports:
      # Cambia 8080 por cualquier puerto libre del host.
      - "8080:80"
    networks:
      - nukiyasu

networks:
  nukiyasu:

volumes:
  cache:
  mongo:
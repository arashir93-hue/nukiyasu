name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Opcionales: si están configurados, el APK de release se firma con tu keystore
  # (imprescindible para poder actualizar la app encima de la instalada).
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$ANDROID_SDK_ROOT"/platform-tools/adb --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build APKs
        working-directory: android
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Preparar APKs
        working-directory: android
        run: |
          mkdir -p build/apk
          cp app/build/outputs/apk/release/app-release.apk build/apk/Nukiyasu-android-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/apk/Nukiyasu-android-debug.apk
          # Alias históricos: conservan las URLs de descarga existentes.
          cp build/apk/Nukiyasu-android-release.apk build/apk/Yomiyasu-android-release.apk
          cp build/apk/Nukiyasu-android-debug.apk build/apk/Yomiyasu-android-debug.apk
          ls -lh build/apk

      - name: Preparar metadata de actualización
        working-directory: android
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "No es una ejecución de release/tag; no se genera metadata publicable."
            exit 0
          fi

          AAPT=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -1)
          if [[ -z "$AAPT" ]]; then
            echo "No se encontró aapt para leer la metadata real del APK."
            exit 1
          fi

          BADGING=$("$AAPT" dump badging build/apk/Nukiyasu-android-release.apk)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          RELEASE_TAG="$GITHUB_REF_NAME"

          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ || -z "$VERSION_NAME" ]]; then
            echo "No se pudo leer versionCode/versionName de la APK release."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${VERSION_NAME}" ]]; then
            echo "El tag $RELEASE_TAG no coincide con la versionName de Gradle/APK: v${VERSION_NAME}."
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          printf '{"versionCode":%s,"versionName":"%s","minimumSupportedVersionCode":0,"releaseUrl":"%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$RELEASE_URL" > build/apk/nukiyasu-update.json
          cat build/apk/nukiyasu-update.json

      - name: Verificar firmas
        working-directory: android
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/apk/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -4
          done

      - name: Resumen
        working-directory: android
        run: |
          shasum -a 256 build/apk/*.apk
          {
            echo "### APKs generados"
            echo ""
            echo '```'
            ls -lh build/apk
            shasum -a 256 build/apk/*.apk
            echo '```'
            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo ""
              echo "> ⚠️ Sin el secreto \`ANDROID_KEYSTORE_BASE64\`, el APK de release va firmado con la clave de debug (no podrá actualizar una instalación firmada con tu keystore)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nukiyasu-apk
          path: android/build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: "Apps móviles"
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TITLE" --latest \
                 --notes "Compilaciones automáticas de iOS (IPA) y Android (APK). Se actualizan con cada push." \
            || true
          gh release upload "$TAG" \
            build/apk/Nukiyasu-android-release.apk build/apk/Nukiyasu-android-debug.apk \
            build/apk/Yomiyasu-android-release.apk build/apk/Yomiyasu-android-debug.apk \
            build/apk/nukiyasu-update.json --clobber
